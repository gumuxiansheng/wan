$:
  tag_push:
    # ── Pipeline 1: 创建 Release + 构建 Linux x86_64 ──
    - name: release-linux-amd64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: rust:latest
      stages:
        - name: create release
          type: git:release
          options:
            overlying: true
            title: $CNB_BRANCH
            description: "wan $CNB_BRANCH - 自动构建发布"
        - name: install targets
          script:
            - rustup target add x86_64-unknown-linux-musl
        - name: build
          env:
            CARGO_TARGET_DIR: ./target-release
          script:
            # musl 静态链接（rust-lld + link-self-contained，见 .cargo/config.toml），
            # 产物无 glibc 依赖，可在任意 Linux 发行版（含 Alpine）直接运行
            - cargo build --release --target x86_64-unknown-linux-musl
            - mkdir -p ./dist
            - cp ./target-release/x86_64-unknown-linux-musl/release/wan ./dist/wan-linux-amd64
        - name: upload release attachment
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/wan-linux-amd64"

    # ── Pipeline 2: 构建 Linux aarch64 ──
    - name: release-linux-arm64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: rust:latest
      stages:
        - name: install targets
          script:
            - rustup target add aarch64-unknown-linux-musl
        - name: build
          env:
            CARGO_TARGET_DIR: ./target-release
          script:
            # musl 静态链接（rust-lld + link-self-contained，见 .cargo/config.toml），
            # 产物无 glibc 依赖，可在任意 Linux 发行版（含 Alpine）直接运行
            - cargo build --release --target aarch64-unknown-linux-musl
            - mkdir -p ./dist
            - cp ./target-release/aarch64-unknown-linux-musl/release/wan ./dist/wan-linux-arm64
        - name: upload release attachment
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/wan-linux-arm64"

    # ── Pipeline 3: 构建 Windows x86_64 ──
    - name: release-windows-amd64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: rust:latest
      stages:
        - name: install targets and linker
          script:
            - rustup target add x86_64-pc-windows-gnu
            - apt-get update && apt-get install -y mingw-w64
        - name: build
          env:
            CARGO_TARGET_DIR: ./target-release
          script:
            - cargo build --release --target x86_64-pc-windows-gnu
            - mkdir -p ./dist
            - cp ./target-release/x86_64-pc-windows-gnu/release/wan.exe ./dist/wan-windows-amd64.exe
            - cp ./target-release/x86_64-pc-windows-gnu/release/wan-shim.exe ./dist/wan-shim-windows-amd64.exe
        - name: upload release attachment
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/wan-windows-amd64.exe"
              - "./dist/wan-shim-windows-amd64.exe"
