name: CI

# 在 push 到 main 以及向 main 发起/合并 PR 时运行
# （PR 合并后会触发 push 到 main，因此合并结果同样会被校验）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 覆盖项目的 unix (libc) 与 windows (windows-sys) 平台专属依赖
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 与 Cargo.toml 中 rust-version = "1.96" 保持一致
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        # 当前为纯报告（不阻断流水线）。如需把 lint 视为错误、强制零 warning，
        # 可改为：cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
